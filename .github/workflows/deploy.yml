name: Deploy GitHub Pages

# Publica a pasta web/ no GitHub Pages a cada push na branch main.
on:
  push:
    branches: [main]
  workflow_dispatch:   # permite rodar manualmente pelo botão "Run workflow"

permissions:
  contents: read
  pages: write
  id-token: write

# Garante um deploy por vez
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Enviar artefato (pasta web/)
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Publicar no Pages
        id: deployment
        uses: actions/deploy-pages@v4
